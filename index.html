<head>
<meta charset="UTF-8">
<title>Feeding Frenzy - GenSan Tuna Wars</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Bangers&display=swap');

* { box-sizing: border-box; }

body { 
    margin: 0; 
    background: linear-gradient(135deg, #006994 0%, #004d6f 50%, #001a33 100%);
    overflow: hidden; 
    font-family: 'Fredoka', sans-serif;
    height: 100vh;
}

canvas { 
    display: block; 
    margin: auto;
    border: 6px solid rgba(255, 215, 0, 0.8);
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 0, 0, 0.4);
}

#ui-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1000;
}

#header {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 56px;
    font-weight: 700;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 3px 3px 0px rgba(0, 0, 0, 0.8);
    font-family: 'Bangers', cursive;
    letter-spacing: 2px;
    animation: pulse-glow 2s ease-in-out infinite;
}

@keyframes pulse-glow {
    0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 3px 3px 0px rgba(0, 0, 0, 0.8); }
    50% { text-shadow: 0 0 30px rgba(255, 215, 0, 1), 3px 3px 0px rgba(0, 0, 0, 0.9); }
}

#stats {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 60px;
    background: linear-gradient(135deg, rgba(0, 150, 200, 0.9), rgba(0, 100, 150, 0.9));
    padding: 15px 40px;
    border-radius: 20px;
    border: 3px solid #00FFFF;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    font-size: 24px;
    font-weight: bold;
    color: #FFFFFF;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
}

.stat {
    display: flex;
    align-items: center;
    gap: 12px;
}

.stat-label {
    color: #FFD700;
    font-weight: 700;
}

.stat-value {
    color: #00FF00;
    font-family: monospace;
    font-size: 28px;
    font-weight: 700;
}

#size-bar {
    position: absolute;
    top: 180px;
    right: 30px;
    width: 280px;
    background: linear-gradient(90deg, rgba(0,0,0,0.7), rgba(0,0,0,0.5));
    padding: 12px;
    border-radius: 12px;
    border: 2px solid #00FFFF;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
}

.size-label {
    font-size: 14px;
    color: #00FF00;
    font-weight: bold;
    margin-bottom: 8px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
}

.size-bar-inner {
    width: 100%;
    height: 20px;
    background: linear-gradient(90deg, #1E90FF, #00BFFF);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #00FFFF;
}

.size-progress {
    height: 100%;
    background: linear-gradient(90deg, #00FF00, #FFD700);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
}

#game-over {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(50, 50, 100, 0.95));
    padding: 50px;
    border-radius: 30px;
    border: 4px solid #FFD700;
    text-align: center;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
    z-index: 2000;
    animation: game-over-pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes game-over-pop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

#game-over h1 {
    font-family: 'Bangers', cursive;
    font-size: 72px;
    color: #FF6347;
    margin: 0 0 30px 0;
    text-shadow: 0 0 20px rgba(255, 99, 71, 0.8);
}

#game-over .final-stats {
    font-size: 28px;
    color: #00FF00;
    margin: 20px 0;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

#game-over .final-stats .label {
    color: #FFD700;
    font-weight: bold;
}

#restart-hint {
    margin-top: 40px;
    font-size: 22px;
    color: #00FFFF;
    animation: blink 1s infinite;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

@keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0.5; }
}

#tutorial {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    color: #00FFFF;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    background: linear-gradient(135deg, rgba(0, 100, 150, 0.8), rgba(0, 50, 100, 0.8));
    padding: 12px 24px;
    border-radius: 12px;
    border: 2px solid #00FFFF;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="1080" height="1920"></canvas>

<div id="ui-container">
    <div id="header">🐟 TUNA WARS 🐟</div>
    
    <div id="stats">
        <div class="stat">
            <span class="stat-label">SCORE:</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">LEVEL:</span>
            <span class="stat-value" id="level">1</span>
        </div>
        <div class="stat">
            <span class="stat-label">HEALTH:</span>
            <span class="stat-value" id="health">100</span><span>%</span>
        </div>
    </div>
    
    <div id="size-bar">
        <div class="size-label">SIZE GROWTH</div>
        <div class="size-bar-inner">
            <div class="size-progress" id="size-progress"></div>
        </div>
    </div>
    
    <div id="game-over">
        <h1>GAME OVER!</h1>
        <div class="final-stats">
            <div><span class="label">FINAL SCORE:</span> <span id="final-score">0</span></div>
            <div><span class="label">LEVEL REACHED:</span> <span id="final-level">1</span></div>
            <div><span class="label">SIZE:</span> <span id="final-size">1</span>x</div>
        </div>
        <div id="restart-hint">↓ PRESS DOWN TO RESTART ↓</div>
    </div>
    
    <div id="tutorial">← MOVE LEFT | MOVE RIGHT → | EAT SMALL FISH | AVOID LARGE</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ===== GAME STATE =====
let gameState = {
    score: 0,
    level: 1,
    gameOver: false,
    gameTime: 0,
    playerSize: 1,
    playerHealth: 100,
    eatenCount: 0
};

// ===== PLAYER (TUNA) =====
const player = {
    x: canvas.width / 2,
    y: canvas.height - 200,
    width: 50,
    height: 30,
    vx: 0,
    speedBase: 10,
    size: 1,
    mouthAngle: 0,
    
    draw: function() {
        const t = Date.now() / 100;
        const bob = Math.sin(t * 0.02) * 3;
        const wiggle = Math.sin(t * 0.08) * 0.08;
        
        ctx.save();
        ctx.translate(this.x, this.y + bob);
        ctx.rotate(wiggle);
        
        const w = this.width * this.size;
        const h = this.height * this.size;
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(0, h/2 + 8, w/2 + 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Glow aura
        ctx.fillStyle = `rgba(255, 215, 0, ${0.2 + Math.sin(t * 0.05) * 0.1})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, w/2 + 15, h/2 + 10, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Body gradient
        const bodyGrad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
        bodyGrad.addColorStop(0, '#1a4d7a');
        bodyGrad.addColorStop(0.5, '#2d7bb8');
        bodyGrad.addColorStop(1, '#3d9dd9');
        
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(-w/2, 0);
        ctx.quadraticCurveTo(-w/4, -h/2, w/4, -h/2);
        ctx.lineTo(w/2, 0);
        ctx.quadraticCurveTo(w/4, h/2, -w/4, h/2);
        ctx.closePath();
        ctx.fill();
        
        // Lateral line
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-w/2 + 5, 0);
        ctx.lineTo(w/2 - 5, 0);
        ctx.stroke();
        
        // Dorsal fin
        ctx.fillStyle = '#FF6347';
        ctx.beginPath();
        ctx.moveTo(-w/4, -h/2);
        ctx.lineTo(-w/4 - 8, -h/2 - 15);
        ctx.lineTo(-w/4 + 8, -h/2);
        ctx.closePath();
        ctx.fill();
        
        // Tail fin
        ctx.fillStyle = '#FF4500';
        const tailSwing = Math.sin(t * 0.15) * 15;
        ctx.beginPath();
        ctx.moveTo(w/2, -h/3);
        ctx.lineTo(w/2 + 20 + tailSwing, -h/1.5);
        ctx.lineTo(w/2 + 20 + tailSwing, h/1.5);
        ctx.lineTo(w/2, h/3);
        ctx.closePath();
        ctx.fill();
        
        // Pectoral fins
        ctx.fillStyle = 'rgba(255, 100, 50, 0.7)';
        const finWave = Math.sin(t * 0.12) * 10;
        ctx.beginPath();
        ctx.ellipse(-w/6, h/2 - 3, 8, finWave + 12, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w/6, h/2 - 3, 8, finWave + 12, -0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Eye
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(w/3, -h/4, 4 * this.size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(w/3 + 1.5, -h/4 - 1.5, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Mouth
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w/2, 0, 4, -Math.PI/3, Math.PI/3);
        ctx.stroke();
        
        ctx.restore();
    },
    
    update: function() {
        this.x += this.vx;
        
        // Boundaries
        if (this.x - this.width/2 * this.size < 40) this.x = 40 + this.width/2 * this.size;
        if (this.x + this.width/2 * this.size > canvas.width - 40) this.x = canvas.width - 40 - this.width/2 * this.size;
        
        // Speed increases with size
        this.speedBase = 10 + this.size * 0.5;
    }
};

// ===== FISH TYPES =====
const fishTypes = [
    { name: 'sardine', size: 0.4, color: '#4A7BA7', color2: '#87CEEB', speed: 2, points: 10, healthGain: 5 },
    { name: 'anchovy', size: 0.35, color: '#5A6F8F', color2: '#6FA8D4', speed: 3, points: 15, healthGain: 8 },
    { name: 'skipjack', size: 0.6, color: '#1E3F66', color2: '#2D7BB8', speed: 2.5, points: 25, healthGain: 12 },
    { name: 'mackerel', size: 0.5, color: '#2C4A6F', color2: '#3D8FCC', speed: 3.5, points: 20, healthGain: 10 },
    { name: 'herring', size: 0.45, color: '#3D5A8F', color2: '#5A8FD4', speed: 2.8, points: 18, healthGain: 9 }
];

let fish = [];
let particles = [];
let powerUps = [];
let bubbles = [];

// ===== FISH SPAWNING =====
function spawnFish() {
    const fishType = fishTypes[Math.floor(Math.random() * fishTypes.length)];
    const x = Math.random() * (canvas.width - 200) + 100;
    const y = Math.random() * (canvas.height * 0.6) + 100;
    
    fish.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * fishType.speed,
        vy: (Math.random() - 0.5) * fishType.speed,
        width: 40,
        height: 20,
        type: fishType,
        rotation: 0,
        wobble: Math.random() * Math.PI * 2,
        eaten: false,
        
        draw: function() {
            const t = Date.now() / 100;
            const wobAng = Math.sin(t * 0.08 + this.wobble) * 0.15;
            
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(wobAng);
            
            const w = this.width;
            const h = this.height;
            
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(0, h/2 + 4, w/2 + 5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Body gradient
            const grad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
            grad.addColorStop(0, this.type.color);
            grad.addColorStop(0.5, this.type.color2);
            grad.addColorStop(1, '#B0D4E3');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-w/2, 0);
            ctx.quadraticCurveTo(-w/4, -h/2, w/4, -h/2);
            ctx.lineTo(w/2, 0);
            ctx.quadraticCurveTo(w/4, h/2, -w/4, h/2);
            ctx.closePath();
            ctx.fill();
            
            // Tail
            ctx.fillStyle = '#FF6347';
            const tailSwing = Math.sin(t * 0.2 + this.wobble) * 8;
            ctx.beginPath();
            ctx.moveTo(w/2, -h/3);
            ctx.lineTo(w/2 + 12 + tailSwing, -h/1.5);
            ctx.lineTo(w/2 + 12 + tailSwing, h/1.5);
            ctx.lineTo(w/2, h/3);
            ctx.closePath();
            ctx.fill();
            
            // Dorsal fin
            ctx.fillStyle = '#FF6347';
            ctx.beginPath();
            ctx.moveTo(-w/4, -h/2);
            ctx.lineTo(-w/4 - 5, -h/2 - 8);
            ctx.lineTo(-w/4 + 5, -h/2);
            ctx.closePath();
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(w/4, -h/3, 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
    });
}

// ===== PARTICLES & EFFECTS =====
function createExplosion(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const speed = 3 + Math.random() * 4;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function createBubble(x, y) {
    bubbles.push({
        x: x,
        y: y,
        radius: 2 + Math.random() * 4,
        speed: 0.5 + Math.random() * 1.5,
        life: 1
    });
}

function spawnPowerUp(x, y) {
    if (Math.random() < 0.15) {
        powerUps.push({
            x: x,
            y: y,
            radius: 12,
            rotation: 0,
            type: Math.random() < 0.5 ? 'health' : 'shield',
            bobOffset: Math.random() * Math.PI * 2,
            collected: false
        });
    }
}

// ===== DRAWING FUNCTIONS =====
function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#1a5fa8');
    grad.addColorStop(0.5, '#0d3d66');
    grad.addColorStop(1, '#001a33');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Depth particulates
    ctx.fillStyle = 'rgba(100, 150, 200, 0.05)';
    const t = Date.now() / 5000;
    for (let i = 0; i < 30; i++) {
        const x = ((i * 67 + t * 50) % canvas.width);
        const y = (i * 64) % canvas.height;
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawWaterEffect() {
    ctx.strokeStyle = 'rgba(100, 180, 220, 0.1)';
    ctx.lineWidth = 1;
    const t = Date.now() / 600;
    
    for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += 40) {
            const y = 200 + i * 100 + Math.sin(x / 80 + t + i) * 20;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
}

function drawBubbles() {
    for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const glow = Math.sin(Date.now() / 200 + i) * 0.3 + 0.7;
        
        ctx.fillStyle = `rgba(200, 230, 255, ${b.life * 0.4 * glow})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = `rgba(255, 255, 255, ${b.life * 0.3 * glow})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        
        b.y -= b.speed;
        b.life -= 0.01;
        if (b.life <= 0) bubbles.splice(i, 1);
    }
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2, '0');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.02;
        
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawPowerUps() {
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        if (pu.collected) continue;
        
        const t = Date.now() / 100;
        const bob = Math.sin(t * 0.03 + pu.bobOffset) * 8;
        
        ctx.save();
        ctx.translate(pu.x, pu.y + bob);
        pu.rotation += 0.05;
        ctx.rotate(pu.rotation);
        
        // Outer glow
        const glowColor = pu.type === 'health' ? '#FF6347' : '#00FF00';
        ctx.fillStyle = glowColor + '44';
        ctx.beginPath();
        ctx.arc(0, 0, pu.radius * 1.8, 0, Math.PI * 2);
        ctx.fill();
        
        // Main shape
        ctx.fillStyle = glowColor;
        if (pu.type === 'health') {
            // Plus sign for health
            ctx.fillRect(-6, -3, 12, 6);
            ctx.fillRect(-3, -6, 6, 12);
        } else {
            // Shield star
            for (let j = 0; j < 5; j++) {
                const angle = j * Math.PI * 2 / 5 - Math.PI / 2;
                const x = Math.cos(angle) * pu.radius;
                const y = Math.sin(angle) * pu.radius;
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
        }
        
        ctx.restore();
    }
}

function drawFish() {
    for (let f of fish) {
        if (!f.eaten) f.draw();
    }
}

// ===== COLLISION DETECTION =====
function checkCollisions() {
    const playerSize = player.width * player.size;
    
    // Check fish collisions
    for (let i = fish.length - 1; i >= 0; i--) {
        const f = fish[i];
        const fishSize = f.width * 0.7;
        const dist = Math.hypot(f.x - player.x, f.y - player.y);
        const canEat = playerSize > fishSize * 1.2;
        
        if (dist < playerSize/2 + fishSize/2) {
            if (canEat && !f.eaten) {
                // Eat the fish
                f.eaten = true;
                gameState.score += f.type.points * gameState.level;
                gameState.eatenCount++;
                gameState.playerHealth = Math.min(100, gameState.playerHealth + f.type.healthGain);
                player.size += 0.08;
                
                createExplosion(f.x, f.y, f.type.color2, 15);
                spawnPowerUp(f.x, f.y);
                
                // Spawn bubbles
                for (let j = 0; j < 8; j++) {
                    createBubble(f.x + (Math.random() - 0.5) * 20, f.y + (Math.random() - 0.5) * 20);
                }
                
                fish.splice(i, 1);
            } else if (!canEat) {
                // Got eaten
                gameState.playerHealth -= 15;
                createExplosion(player.x, player.y, '#FF6347', 20);
                if (gameState.playerHealth <= 0) gameState.gameOver = true;
            }
        }
    }
    
    // Check power-up collisions
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        const dist = Math.hypot(pu.x - player.x, pu.y - player.y);
        
        if (dist < playerSize/2 + pu.radius) {
            pu.collected = true;
            if (pu.type === 'health') {
                gameState.playerHealth = Math.min(100, gameState.playerHealth + 25);
            } else {
                gameState.playerHealth = Math.min(100, gameState.playerHealth + 15);
            }
            createExplosion(pu.x, pu.y, '#FFD700', 10);
            powerUps.splice(i, 1);
        }
    }
}

// ===== LEVEL & DIFFICULTY =====
function updateLevel() {
    const newLevel = Math.floor(gameState.eatenCount / (5 + gameState.level * 2)) + 1;
    if (newLevel > gameState.level) {
        gameState.level = newLevel;
        gameState.playerHealth = Math.min(100, gameState.playerHealth + 30);
    }
}

// ===== REMOTE CONTROL (RunSam) =====
let cmdLock = {left:false,right:false,down:false};
function handleCmd(cmd){
    if(cmd==='left' && !cmdLock.left){
        player.vx = -player.speedBase;
        cmdLock.left=true;
    }
    if(cmd==='right' && !cmdLock.right){
        player.vx = player.speedBase;
        cmdLock.right=true;
    }
    if(cmd==='down' && !cmdLock.down && gameState.gameOver){ 
        restartGame(); 
        cmdLock.down=true; 
    }
}

setInterval(()=>{
    cmdLock={left:false,right:false,down:false}; 
    player.vx *= 0.85;
},100);

function hookConsole(win){
    try{
        const _log = win.console.log.bind(win.console);
        win.console.log = function(...args){
            _log(...args);
            try{
                const str = args.map(a=>typeof a==='object'?JSON.stringify(a):String(a)).join(' ');
                const paramMatch = str.match(/param['":\s]+([xy])/i);
                const amountMatch = str.match(/amount['":\s]+(-?\d+)/i);
                if(paramMatch && amountMatch){
                    const param = paramMatch[1].toLowerCase();
                    const amount = parseInt(amountMatch[1],10);
                    if(param==='x' && amount>=1) handleCmd('right');
                    else if(param==='x' && amount<=-1) handleCmd('left');
                    else if(param==='y' && amount>=1) handleCmd('down');
                }
            }catch(e){}
        }
    }catch(e){}
}
hookConsole(window);
try{hookConsole(window.parent);}catch(e){}
try{hookConsole(window.top);}catch(e){}
setTimeout(()=>{hookConsole(window); try{hookConsole(window.parent);}catch(e){} try{hookConsole(window.top);}catch(e){}},800);

document.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown') restartGame();
    if(e.key==='ArrowLeft') handleCmd('left');
    if(e.key==='ArrowRight') handleCmd('right');
});

// ===== MAIN GAME LOOP =====
function gameLoop() {
    drawBackground();
    drawWaterEffect();
    
    if (!gameState.gameOver) {
        gameState.gameTime++;
        
        // Spawn fish
        if (gameState.gameTime % (120 - gameState.level * 5) === 0) {
            const spawnCount = 1 + Math.floor(gameState.level / 2);
            for (let i = 0; i < spawnCount; i++) {
                spawnFish();
            }
        }
        
        // Update
        player.update();
        player.draw();
        
        // Update fish
        for (let i = fish.length - 1; i >= 0; i--) {
            const f = fish[i];
            f.x += f.vx;
            f.y += f.vy;
            
            // Bounce
            if (f.x < 30 || f.x > canvas.width - 30) f.vx *= -1;
            if (f.y < 30 || f.y > canvas.height - 100) f.vy *= -1;
            
            f.draw();
            
            // Remove if off screen too long
            if (f.y > canvas.height + 50) fish.splice(i, 1);
        }
        
        checkCollisions();
        updateLevel();
        
        // Difficulty: larger fish appear later
        if (gameState.level > 2) {
            if (gameState.gameTime % 300 === 0) {
                const x = Math.random() * (canvas.width - 200) + 100;
                const y = Math.random() * (canvas.height * 0.3) + 50;
                const type = fishTypes[Math.floor(Math.random() * 3) + 2];
                fish.push({
                    x, y, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
                    width: 60, height: 30, type: type, rotation: 0, wobble: Math.random() * Math.PI * 2,
                    eaten: false,
                    draw: function() {
                        const t = Date.now() / 100;
                        const wobAng = Math.sin(t * 0.08 + this.wobble) * 0.15;
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(wobAng);
                        const w = this.width, h = this.height;
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                        ctx.beginPath();
                        ctx.ellipse(0, h/2 + 5, w/2 + 8, 3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        const grad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
                        grad.addColorStop(0, '#1a1a4d');
                        grad.addColorStop(0.5, '#2d2d7a');
                        grad.addColorStop(1, '#4d4daa');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.moveTo(-w/2, 0);
                        ctx.quadraticCurveTo(-w/4, -h/2, w/4, -h/2);
                        ctx.lineTo(w/2, 0);
                        ctx.quadraticCurveTo(w/4, h/2, -w/4, h/2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#8B0000';
                        const tailSwing = Math.sin(t * 0.2 + this.wobble) * 12;
                        ctx.beginPath();
                        ctx.moveTo(w/2, -h/3);
                        ctx.lineTo(w/2 + 18 + tailSwing, -h/1.3);
                        ctx.lineTo(w/2 + 18 + tailSwing, h/1.3);
                        ctx.lineTo(w/2, h/3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#8B0000';
                        ctx.beginPath();
                        ctx.moveTo(-w/4, -h/2);
                        ctx.lineTo(-w/4 - 6, -h/2 - 12);
                        ctx.lineTo(-w/4 + 6, -h/2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(w/3, -h/3, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }
        }
        
        // Health degradation
        gameState.playerHealth -= 0.01;
        if (gameState.playerHealth <= 0) gameState.gameOver = true;
        
    } else {
        // Game Over screen
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        document.getElementById('game-over').style.display = 'block';
    }
    
    drawFish();
    drawPowerUps();
    drawBubbles();
    drawParticles();
    
    // Update HUD
    document.getElementById('score').textContent = gameState.score.toLocaleString();
    document.getElementById('level').textContent = gameState.level;
    document.getElementById('health').textContent = Math.max(0, Math.round(gameState.playerHealth));
    
    const sizePercent = Math.min(100, (player.size - 1) * 50);
    document.getElementById('size-progress').style.width = sizePercent + '%';
    
    requestAnimationFrame(gameLoop);
}

function restartGame() {
    gameState = {
        score: 0,
        level: 1,
        gameOver: false,
        gameTime: 0,
        playerSize: 1,
        playerHealth: 100,
        eatenCount: 0
    };
    
    player.x = canvas.width / 2;
    player.y = canvas.height - 200;
    player.vx = 0;
    player.size = 1;
    
    fish = [];
    particles = [];
    powerUps = [];
    bubbles = [];
    
    document.getElementById('game-over').style.display = 'none';
}

gameLoop();
